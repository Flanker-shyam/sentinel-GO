# Sentinel-GO Configuration — DEV environment
targets:
  - namespace: "" # k8 namespace
    pod_patterns:
      - "financial-service-*" #pod pattern (can be identifiable prefix)
    container_patterns:
      - ""  #container names
      - ""

streaming:
  buffer_size: 1000
  tail_lines: 50

dedup:
  enabled: true
  window: "60s"

analysis:
  batch_size: 50
  flush_interval: "30s"
  region: ""  # cluster region
  model_id: "" #take model id from Bedrock and paste here
  max_tokens: 2048
  anomaly_threshold: 6
  min_call_interval: "10s"
  alert_cooldown: "15m"    # suppress repeat alerts for the same service within this window

notification:
  google_chat:
    enabled: true
    webhook_url: "${GCHAT_WEBHOOK_URL}"

# Sentinel-GO Configuration
targets:
  - namespace: "tp-rc"
    pod_patterns:
      - "plan-outcome-reporting-compute-.*"
      - "plan-outcome-reporting-api-.*"
    container_patterns:
      - "plan-outcome-reporting-compute"
      - "plan-outcome-reporting-api"

streaming:
  buffer_size: 1000
  tail_lines: 50

analysis:
  batch_size: 50
  flush_interval: "30s"
  region: "eu-west-1"
  model_id: "anthropic.claude-3-5-sonnet-20241022-v2:0"
  max_tokens: 2048
  anomaly_threshold: 6   # alert only if severity >= this

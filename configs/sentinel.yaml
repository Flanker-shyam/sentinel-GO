# Sentinel-GO Configuration
targets:
  - namespace: "tp-rc"
    pod_patterns:
      - "plan-outcome-reporting-.*"
    container_patterns:
      - "plan-outcome-reporting-compute"
      - "plan-outcome-reporting-api"

streaming:
  buffer_size: 1000
  tail_lines: 50

dedup:
  enabled: true
  window: "60s"           # suppress duplicate lines within this window

analysis:
  batch_size: 50
  flush_interval: "30s"
  region: "eu-west-1"
  model_id: "eu.anthropic.claude-sonnet-4-5-20250929-v1:0"
  max_tokens: 2048
  anomaly_threshold: 6
  min_call_interval: "10s"  # rate limit: max 1 LLM call per this interval

notification:
  google_chat:
    enabled: true
    webhook_url: "${GCHAT_WEBHOOK_URL}"
